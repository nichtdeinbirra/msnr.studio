<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3F70F"/>
      <stop offset="100%" stop-color="#6FD60A"/>
    </linearGradient>
    <filter id="iconGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#A3F70F" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0A0A0A"/>

  <g transform="translate(64, 64)" filter="url(#iconGlow)">
    <circle r="44" fill="none" stroke="url(#iconGrad)" stroke-width="3" stroke-dasharray="32 16" stroke-linecap="round"/>
    <circle r="32" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <circle r="8" fill="url(#iconGrad)"/>
    <g stroke="#A3F70F" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-24" x2="0" y2="-12"/>
      <line x1="0" y1="12" x2="0" y2="24"/>
      <line x1="-24" y1="0" x2="-12" y2="0"/>
      <line x1="12" y1="0" x2="24" y2="0"/>
    </g>
  </g>
</svg>